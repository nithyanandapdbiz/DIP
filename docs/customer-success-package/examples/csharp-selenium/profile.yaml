# DBiz Execution Plane — tenant configuration
# Synthetic values throughout. Replace tenantId and registrationEndpoint with the
# ones issued to you during onboarding.
tenant:
  tenantId: tenant-example
  registrationEndpoint: https://gateway.example.test/v1/register
technologyProfile:
  profileVersion: 1.0.0
  language: csharp
  framework: selenium
  testRunner: nunit
  ciSystem: github-actions
  gitProvider: github
  cloudProvider: azure
  deploymentModel: container
  packageManager: nuget
  reportingFramework: allure
  frameworkVersions:
    Allure.NUnit: "2.12.1"
    Microsoft.NET.Test.Sdk: "17.12.0"
    NUnit: "4.2.2"
    NUnit3TestAdapter: "4.6.0"
    Selenium.WebDriver: "4.27.0"
